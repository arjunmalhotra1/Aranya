<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClusterView</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ClusterView</h1>
    <label class="view-picker">View
      <select id="view">
        <option value="">All namespaces</option>
      </select>
    </label>
    <span id="updated" class="updated" aria-live="polite"></span>
  </header>
  <main>
    <section id="summary" aria-label="Selected ClusterView"></section>
    <section id="nodes" aria-label="Nodes"></section>
    <section id="pods" aria-label="Pods on the selected node"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
