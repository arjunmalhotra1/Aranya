# This rule is not used by the project clusterview-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the observability.arjunmalhotra.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterview-operator
    app.kubernetes.io/managed-by: kustomize
  name: clusterview-editor-role
rules:
- apiGroups:
  - observability.arjunmalhotra.dev
  resources:
  - clusterviews
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - observability.arjunmalhotra.dev
  resources:
  - clusterviews/status
  verbs:
  - get
